[project]
name = "capa-8d-expert"
version = "0.1.0"
description = "CAPA/8D Expert Knowledge Worker RAG App"
requires-python = ">=3.11"

dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "chromadb>=0.5.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",
    "tqdm>=4.66.0",
    "gradio>=5.0.0",
    "pydantic>=2.0.0",
    # BGE reranker — install separately if you want local reranking:
    # uv add torch transformers
    # (~2GB download for torch, ~570MB for the model on first run)
    "torch>=2.11.0",
    "transformers>=5.3.0",
    "scikit-learn>=1.8.0",
    "plotly>=6.6.0",
    "langfuse>=4.3.1",
    "litellm>=1.83.14",
    "groq>=1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
capa-8d-answer = "capa_8d_expert.answer:main"
capa-8d-ingest = "capa_8d_expert.ingest:main"

[tool.hatch.build.targets.wheel]
packages = ["src/capa_8d_expert"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.uv.sources]
# torch from PyPI (CPU-only build is lighter — swap for cu121 if you have a GPU)
